name: Deploy web app
on:
  push:
    branches: [main, claude/upbeat-mendel-oshr8p]
  workflow_dispatch:
concurrency: deploy-pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter app build
      # Pushes to main and manual runs (Run workflow) deploy production; other branches get a preview.
      # (wrangler via npx: cloudflare/wrangler-action runs `pnpm add`, which pnpm refuses in a workspace)
      - run: npx -y wrangler@4 pages deploy apps/app/dist --project-name southington-golf --branch "$BRANCH" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
