[project]
name = "coursebuilder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32", "numpy>=2.0", "rasterio>=1.4", "laspy[lazrs]>=2.5", "shapely>=2.0",
  "pyproj>=3.6", "pyyaml>=6.0", "pillow>=10.0", "mercantile>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coursebuilder"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
